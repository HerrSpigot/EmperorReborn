name: build

# Full Release/x86 build, package and checksum. This is reproducible from the repo now that the
# in-game HUD patch source (EmperorHooks/InGameHudFix.cpp, Moro's widescreen patch) is committed.
# The dev machine uses a newer toolset (v145); the runner has VS2022, so we pass -PlatformToolset v143.
# Pinned to windows-2022 because that image ships the v143 toolset.

# Pushing a tag like v2.5-de1, or pushing to german-cd-support, additionally publishes a GitHub Release with the
# zip attached (branch builds get the tag v2.5-de-build<run number>, created by the release step).

on:
  push:
    branches: [ main, german-cd-support ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the version string is consistent across the repo
        shell: bash
        run: |
          launcher=$(grep -oE 'Emperor Reborn v[0-9]+\.[0-9]+' EmperorLauncher/EmperorLauncher.cpp | head -1 | grep -oE '[0-9]+\.[0-9]+')
          jsonld=$(grep -oE '"softwareVersion": *"[0-9]+\.[0-9]+"' index.md | head -1 | grep -oE '[0-9]+\.[0-9]+')
          readme=$(grep -oE 'EmperorReborn-v[0-9]+\.[0-9]+(-de)?\.zip' readme.md | head -1 | grep -oE '[0-9]+\.[0-9]+')
          package=$(grep -oE '\$Version = "[0-9]+\.[0-9]+"' package.ps1 | head -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "launcher=$launcher jsonld=$jsonld readme=$readme package=$package"
          for v in "$launcher" "$jsonld" "$readme" "$package"; do
            if [ -z "$v" ]; then echo "::error::a version string was not found"; exit 1; fi
          done
          if [ "$launcher" = "$jsonld" ] && [ "$jsonld" = "$readme" ] && [ "$readme" = "$package" ]; then
            echo "version $launcher is consistent"
          else
            echo "::error::version mismatch (launcher=$launcher jsonld=$jsonld readme=$readme package=$package)"
            exit 1
          fi

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Tag builds are named after the tag (v2.5-de1 -> EmperorReborn-v2.5-de1.zip), german-cd-support builds
      # are "2.5-de", everything else is "ci".
      - name: Pick package version
        id: ver
        shell: bash
        run: |
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"; tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "german-cd-support" ]; then
            v="2.5-de"; tag="v2.5-de-build${GITHUB_RUN_NUMBER}"
          else
            v="ci"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and package (Release/x86)
        shell: pwsh
        run: .\package.ps1 -Version ${{ steps.ver.outputs.version }} -PlatformToolset v143

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: EmperorReborn-${{ steps.ver.outputs.version }}
          path: |
            dist/EmperorReborn-v${{ steps.ver.outputs.version }}.zip
            dist/EmperorReborn-v${{ steps.ver.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Publish release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Emperor Reborn ${{ steps.ver.outputs.tag }}
          body: |
            Build of ${{ steps.ver.outputs.tag }} with support for the German CDs (Emperor: Schlacht um Dune).

            Unzip, put your own v1.09 patch next to EmperorReborn.exe (EM109DE.EXE for the German CDs,
            EM109EN.EXE for the English ones) and run EmperorReborn.exe. See INSTALL.txt.
            The EA patch and game data are not included.

            SHA256 of the zip is in the attached .sha256 file; SHA256SUMS.txt inside the zip covers the exe and dll.
          files: |
            dist/EmperorReborn-v${{ steps.ver.outputs.version }}.zip
            dist/EmperorReborn-v${{ steps.ver.outputs.version }}.zip.sha256
